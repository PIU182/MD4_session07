spring.application.name=config-server
server.port=8888

# Mặc định đúng theo đề Windows: C:/medical-config-repo
# Có thể override bằng Environment Variable CONFIG_REPO_URI.
spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:file:///C:/medical-config-repo}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.refresh-rate=0

management.endpoints.web.exposure.include=health,info
